name = "zsp-relay"
main = "src/worker.js"
compatibility_date = "2026-01-01"

[build]
command = "../x wasm"

[[durable_objects.bindings]]
name = "SPACE"
class_name = "Space"

[[durable_objects.bindings]]
name = "LABEL"
class_name = "Label"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Space"]

# Where the public reaches what devices expose (SPEC §17): a label's own object knows which space's it is.
[[migrations]]
tag = "v2-labels"
new_sqlite_classes = ["Label"]

# Where a space is kept beyond what its object's own storage holds: without it, a space is kept in that storage alone
# until it is full. `wrangler r2 bucket create zsp-relay` first.
[[r2_buckets]]
binding = "STORE"
bucket_name = "zsp-relay"

# wrangler secret put RELAY_SECRET    64 hex digits: openssl rand -hex 32
# wrangler secret put ACCESS_TOKEN    optional
# EXPOSE_DOMAIN, a var: devices' exposed ports are https://<label>.<it>, given a route *.<it>/* to this Worker
