name: diag
on: [push]
jobs:
  e2e:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: laytan/setup-odin@v2
        with:
          release: dev-2026-11
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          mkdir -p build
          odin build zspd -out:build/zspd.exe -debug -vet -strict-style -define:ODIN_NBIO_QUEUE_SIZE=256 -define:ZSP_CALL_ALIVE=1000
          (cd relay && npm ci --silent)
      - name: fsync, by drive
        run: |
          echo "TEMP=$TEMP RUNNER_TEMP=$RUNNER_TEMP"
          for d in "$(python -c 'import tempfile; print(tempfile.gettempdir())')" "$RUNNER_TEMP"; do python tests/diag_fsync.py "$d"; done
      - name: e2e, temp on the system drive
        run: for i in 1 2 3; do python tests/end_to_end.py > e2e-c-$i.log 2>&1; echo "run $i: exit $? $(grep -c '^ok ' e2e-c-$i.log) ok $(grep -c '^FAIL' e2e-c-$i.log) fail"; grep -h "^FAIL" e2e-c-$i.log | cut -c1-150; done; grep -h "roster in" e2e-c-*.log | python tests/diag_sum.py
      - name: e2e, temp on the runner's drive
        run: for i in 1 2 3; do TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP" python tests/end_to_end.py > e2e-d-$i.log 2>&1; echo "run $i: exit $? $(grep -c '^ok ' e2e-d-$i.log) ok $(grep -c '^FAIL' e2e-d-$i.log) fail"; grep -h "^FAIL" e2e-d-$i.log | cut -c1-150; done; grep -h "roster in" e2e-d-*.log | python tests/diag_sum.py
      - name: durations
        run: for f in e2e-*.log; do echo "== $f"; grep -h "^ok \|^FAIL" $f | awk '{print $2, $3}' | sort | tr '\n' ' '; echo; done
