name: diag
on: [push]
jobs:
  e2e:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: laytan/setup-odin@v2
        with:
          release: dev-2026-11
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tools
        run: |
          mkdir -p ~/tools && cd ~/tools
          curl -fsSLo lune.zip https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-windows-x86_64.zip
          unzip -qo lune.zip
          curl -fsSLo luau.zip https://github.com/luau-lang/luau/releases/download/0.748/luau-windows.zip
          unzip -qo luau.zip
          echo "$HOME/tools" >> "$GITHUB_PATH"
      - name: ./x test once, as CI runs it, which builds all it needs
        run: |
          set +e
          ./x test > xtest.log 2>&1; echo "exit $?"; grep -E "^FAIL|failed:" xtest.log | cut -c1-200 || true
      - name: fsync, by drive
        if: always()
        run: |
          echo "TEMP=$TEMP RUNNER_TEMP=$RUNNER_TEMP"
          for d in "$(python -c 'import tempfile; print(tempfile.gettempdir())')" "$RUNNER_TEMP"; do python tests/diag_fsync.py "$d"; done
      - name: e2e, temp on the system drive
        if: always()
        run: |
          set +e
          for i in 1 2 3 4 5 6; do (cd web && for t in text mirror_model mirror_interop store end_to_end browsers; do a=; [ $t = store ] && a=../build/node-small.wasm; node test/$t.ts $a > ../web-c-$i-$t.log 2>&1 & done; wait) & (typeperf "\\Processor(_Total)\\% Processor Time" "\\LogicalDisk(C:)\\Avg. Disk sec/Write" "\\LogicalDisk(D:)\\Avg. Disk sec/Write" "\\LogicalDisk(C:)\\Current Disk Queue Length" "\\LogicalDisk(D:)\\Current Disk Queue Length" -si 1 -sc 100 -f CSV -o perf-c-$i.csv -y > /dev/null 2>&1 &) ; sleep 15; python tests/end_to_end.py > e2e-c-$i.log 2>&1; echo "run $i: exit $? $(grep -c '^ok ' e2e-c-$i.log) ok $(grep -c '^FAIL' e2e-c-$i.log) fail"; grep -h "^FAIL" e2e-c-$i.log | cut -c1-150; wait; echo "  web: $(cat web-c-$i-*.log | grep -c '^FAIL') fail"; done; grep -h "roster in" e2e-c-*.log | python tests/diag_sum.py || true
      - name: e2e, temp on the runner's drive
        if: always()
        run: |
          set +e
          for i in 1 2 3 4 5 6; do (cd web && for t in text mirror_model mirror_interop store end_to_end browsers; do a=; [ $t = store ] && a=../build/node-small.wasm; TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP" node test/$t.ts $a > ../web-d-$i-$t.log 2>&1 & done; wait) & (typeperf "\\Processor(_Total)\\% Processor Time" "\\LogicalDisk(C:)\\Avg. Disk sec/Write" "\\LogicalDisk(D:)\\Avg. Disk sec/Write" "\\LogicalDisk(C:)\\Current Disk Queue Length" "\\LogicalDisk(D:)\\Current Disk Queue Length" -si 1 -sc 100 -f CSV -o perf-d-$i.csv -y > /dev/null 2>&1 &) ; sleep 15; TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP" python tests/end_to_end.py > e2e-d-$i.log 2>&1; echo "run $i: exit $? $(grep -c '^ok ' e2e-d-$i.log) ok $(grep -c '^FAIL' e2e-d-$i.log) fail"; grep -h "^FAIL" e2e-d-$i.log | cut -c1-150; wait; echo "  web: $(cat web-d-$i-*.log | grep -c '^FAIL') fail"; done; grep -h "roster in" e2e-d-*.log | python tests/diag_sum.py || true
      - name: counters
        if: always()
        run: |
          sleep 60
          for f in perf-*.csv; do python tests/diag_perf.py $f; done || true
      - name: durations
        if: always()
        run: |
          for f in e2e-*.log; do echo "== $f"; grep -h "^ok \|^FAIL" $f | awk '{print $2, $3}' | sort | tr '\n' ' '; echo; done

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-e2e
          path: |
            e2e-*.log
            web-*.log
            perf-*.csv
            xtest.log
          retention-days: 7
