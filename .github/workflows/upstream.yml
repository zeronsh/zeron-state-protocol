name: upstream
# Each night, two things of the Odin we build with, against the release we pin (dev-2026-11, as test.yml) as the
# control, the newest Odin release and the newest nightly:
# - suite: ./x check and ./x test, on all three platforms, built with each. A failure with the release or the nightly
#   is ours to deal with before we move the pin to it (docs/odin.md), and fails the run loudly.
# - repros: each of tests/upstream, of what upstream gets wrong that we work round (nbio/PATCHES.md), on the platforms
#   it means something on. Against stock with the pinned release it must still say BROKEN (the control: else the repro
#   shows nothing any more), and against our nbio FIXED (else our fix is broken): either failing fails the run.
#   Against stock with the nightly it is information only, never red: "FIXED UPSTREAM" says what we may simplify.
# What each said is in the run's summary. tests/upstream/run.sh says what each repro is held to.
on:
  schedule:
    - cron: "41 4 * * *"
  pull_request:
    paths:
      - ".github/workflows/upstream.yml"
      - "tests/upstream/**"
jobs:
  repros:
    name: "repros, ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: laytan/setup-odin@v2
        with:
          release: dev-2026-11 # as test.yml
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
      - name: repros
        run: |
          latest=$(tests/upstream/nightly.sh ~/odin-nightly)
          case "$RUNNER_OS" in
            Linux) here=linux ;;
            macOS) here=darwin ;;
            Windows) here=windows ;;
          esac
          echo "### Repros on $RUNNER_OS" >>"$GITHUB_STEP_SUMMARY"
          failed=
          # odin_8645 last: it takes every ephemeral port of the machine while it runs.
          for d in $(ls tests/upstream | grep -v '^odin_8645$') odin_8645; do
            [ -f "tests/upstream/$d/main.odin" ] || continue
            grep -Eq "^// Platform:(.*[ ,])? *$here *(,|$)" "tests/upstream/$d/main.odin" || continue
            echo "::group::$d"
            tests/upstream/run.sh "$d" pinned || failed="$failed $d:pinned"
            tests/upstream/run.sh "$d" ours || failed="$failed $d:ours"
            ODIN="$latest" tests/upstream/run.sh "$d" latest
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failed:$failed"
            exit 1
          fi
  suite:
    name: "suite, ${{ matrix.os }}, ${{ matrix.odin }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        odin: [pinned, release, nightly]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - if: matrix.odin != 'nightly'
        uses: laytan/setup-odin@v2
        with:
          release: ${{ matrix.odin == 'pinned' && 'dev-2026-11' || 'latest' }}
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
      - if: matrix.odin == 'nightly'
        name: newest nightly
        run: |
          odin=$(tests/upstream/nightly.sh ~/odin-nightly)
          bin=$(dirname "$odin")
          [ "$RUNNER_OS" = Windows ] && bin=$(cygpath -w "$bin")
          echo "$bin" >>"$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tools
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get install -y -q lld; lune=linux-x86_64; luau=ubuntu ;;
            macOS) brew install -q lld; lune=macos-aarch64; luau=macos ;;
            Windows) lune=windows-x86_64; luau=windows ;;
          esac
          mkdir -p ~/tools && cd ~/tools
          curl -fsSLo lune.zip https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-$lune.zip
          unzip -qo lune.zip
          curl -fsSLo luau.zip https://github.com/luau-lang/luau/releases/download/0.748/luau-$luau.zip
          unzip -qo luau.zip
          echo "$HOME/tools" >> "$GITHUB_PATH"
      - name: toolchain
        run: |
          version=$(odin version | sed 's/.* version //')
          echo "toolchain: ${{ matrix.odin }}, $version"
          echo "- suite on $RUNNER_OS with ${{ matrix.odin }} ($version)" >>"$GITHUB_STEP_SUMMARY"
      - run: ./x check
      - run: ./x test
      - if: runner.os == 'Linux'
        run: ./x selftest
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ runner.os }}-${{ matrix.odin }}
          path: build/*.log
          retention-days: 14
